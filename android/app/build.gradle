plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.ahu_aio"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion
    def abiFilter = System.getenv("ABI_FILTER") ?: ""
    def abiExcludes = []
    if (abiFilter == "arm64-v8a") {
        abiExcludes = ["lib/armeabi-v7a/**", "lib/x86/**", "lib/x86_64/**"]
    } else if (abiFilter == "x86_64") {
        abiExcludes = ["lib/arm64-v8a/**", "lib/armeabi-v7a/**", "lib/x86/**"]
    } else if (abiFilter == "armeabi-v7a") {
        abiExcludes = ["lib/arm64-v8a/**", "lib/x86/**", "lib/x86_64/**"]
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "moe.telecom.ahu_aio"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = "1.0.7.1"
        if (abiFilter != "") {
            ndk {
                abiFilters abiFilter
            }
        }
    }

    signingConfigs {
        release {
            def keystoreFilePath = System.getenv("KEYSTORE_FILE") ?: ""
            if (keystoreFilePath != "" && file(keystoreFilePath).exists()) {
                storeFile file(keystoreFilePath)
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias "ahu-aio"
                keyPassword System.getenv("KEYSTORE_PASSWORD")
            }
        }
    }

    packaging {
        jniLibs {
            excludes += abiExcludes
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            } else {
                signingConfig signingConfigs.debug
            }
        }
    }
}

flutter {
    source = "../.."
}
