name: Beta Build

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

concurrency:
  group: beta-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.6'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # ──── CI 检查 ────
  check:
    name: Format · Analyze · Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Check Formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run Tests
        run: flutter test

  # ──── Beta 版本号 ────
  get-version:
    name: Compute Beta Version
    runs-on: ubuntu-latest
    needs: check
    outputs:
      version: ${{ steps.compute.outputs.version }}
      build_number: ${{ steps.compute.outputs.build_number }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute Beta Version
        id: compute
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          LATEST_TAG="${LATEST_TAG#v}"
          COMMITS_SINCE=$(git rev-list --count ${LATEST_TAG}..HEAD 2>/dev/null || echo "0")
          SHORT_HASH=$(git rev-parse --short=7 HEAD)
          BASE_VERSION=$(grep 'version:' pubspec.yaml | head -1 | sed 's/.*version: *//' | sed 's/+.*//')
          BUILD_NUMBER=$(grep 'version:' pubspec.yaml | head -1 | sed 's/.*+//')
          BETA_VERSION="${BASE_VERSION}-beta.${COMMITS_SINCE}.${SHORT_HASH}"
          echo "version=${BETA_VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "Beta version: ${BETA_VERSION}"

  # ──── Android 构建 ────
  android:
    name: Build Android (${{ matrix.arch }})
    runs-on: ubuntu-latest
    needs: [get-version]
    strategy:
      matrix:
        include:
          - arch: arm64
            target_platform: android-arm64
          - arch: x86_64
            target_platform: android-x64

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      - name: Decode Keystore
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release-key.jks
            echo "KEYSTORE_FILE=release-key.jks" >> $GITHUB_ENV
          fi
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Build APK
        run: |
          flutter build apk --release \
            --target-platform ${{ matrix.target_platform }} \
            --build-name "${{ needs.get-version.outputs.version }}" \
            --build-number "${{ needs.get-version.outputs.build_number }}"
        env:
          KEYSTORE_FILE: ${{ env.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}

      - name: Cleanup Keystore
        if: always()
        run: rm -f android/app/release-key.jks

      - name: Upload APK (Artifact)
        uses: actions/upload-artifact@v7
        with:
          name: ahu-aio-beta-${{ matrix.arch }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK to Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
            echo "Not a tag push, skip release upload"
            exit 0
          fi
          APK_NAME="AHU-AIO-Beta-${{ matrix.arch }}-${{ needs.get-version.outputs.version }}.apk"
          cp build/app/outputs/flutter-apk/app-release.apk "$APK_NAME"
          # 确保 release 存在
          gh release create "$TAG" --repo "${{ github.repository }}" \
            --title "Beta ${TAG}" --generate-notes 2>/dev/null || true
          gh release upload "$TAG" "$APK_NAME" --repo "${{ github.repository }}" --clobber
