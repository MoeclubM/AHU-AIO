name: Build and Release

on:
  push:
    tags:
      - '*'

env:
  FLUTTER_VERSION: '3.35.6'
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # 提取版本信息
  get-version:
    name: Extract Version Info
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      build_number: ${{ steps.get-version.outputs.build_number }}
      tag: ${{ steps.get-version.outputs.tag }}
      changelog: ${{ steps.get-changelog.outputs.changelog }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract Version from Tag
        id: get-version
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#release-}"
          if [[ "$VERSION" =~ ^v?([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            BUILD_NUMBER=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            echo "Invalid release tag format: $VERSION. Expected v<major>.<minor>.<patch>" >&2
            exit 1
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "build_number=${BUILD_NUMBER}" >> $GITHUB_OUTPUT
          echo "tag=${VERSION}" >> $GITHUB_OUTPUT

      - name: Generate Changelog
        id: get-changelog
        run: |
          # 获取上一个标签
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "## Changes since $PREV_TAG" > changelog.md
            echo "" >> changelog.md
            git log --pretty=format:"- %s (%h)" $PREV_TAG..HEAD >> changelog.md
          else
            echo "## Changes in this release" > changelog.md
            echo "" >> changelog.md
            git log --pretty=format:"- %s (%h)" >> changelog.md
          fi
          echo "" >> changelog.md
          echo "" >> changelog.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREV_TAG..${{ steps.get-version.outputs.tag }}" >> changelog.md
          CHANGELOG=$(cat changelog.md)
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  # 运行测试
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: get-version
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Check Formatting
        run: dart format --set-exit-if-changed lib test

      - name: Analyze Code
        run: flutter analyze

  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [get-version, test]
    strategy:
      matrix:
        include:
          - arch: arm64
            target_platform: android-arm64
          - arch: x86_64
            target_platform: android-x64

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Set Up Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set Up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}

    - name: Install Dependencies
      run: flutter pub get

    - name: Build APK
      run: |
        flutter build apk --release --target-platform ${{ matrix.target_platform }} \
          --build-name ${{ needs.get-version.outputs.version }} \
          --build-number ${{ needs.get-version.outputs.build_number }}

    - name: Upload APK
      uses: actions/upload-artifact@v7
      with:
        name: AHU-AIO-Android-${{ matrix.arch }}-${{ needs.get-version.outputs.version }}
        path: build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: [get-version, test]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Install Linux Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

    - name: Set Up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}

    - name: Install Dependencies
      run: flutter pub get

    - name: Enable Linux Desktop
      run: flutter config --enable-linux-desktop

    - name: Build Linux
      run: flutter build linux --release --build-name ${{ needs.get-version.outputs.version }} --build-number ${{ needs.get-version.outputs.build_number }}

    - name: Archive Linux Build
      run: |
        cd build/linux/x64/release/bundle
        tar -czf ../../../../../AHU-AIO-Linux-x86_64-${{ needs.get-version.outputs.version }}.tar.gz .

    - name: Upload Linux Build
      uses: actions/upload-artifact@v7
      with:
        name: AHU-AIO-Linux-x86_64-${{ needs.get-version.outputs.version }}
        path: AHU-AIO-Linux-x86_64-${{ needs.get-version.outputs.version }}.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: read
    needs: [get-version, test]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Set Up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}

    - name: Install Dependencies
      run: flutter pub get

    - name: Enable Windows Desktop
      run: flutter config --enable-windows-desktop

    - name: Build Windows
      run: flutter build windows --release --build-name ${{ needs.get-version.outputs.version }} --build-number ${{ needs.get-version.outputs.build_number }}

    - name: Archive Windows Build
      run: |
        Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath AHU-AIO-Windows-x64-${{ needs.get-version.outputs.version }}.zip
      shell: pwsh

    - name: Upload Windows Build
      uses: actions/upload-artifact@v7
      with:
        name: AHU-AIO-Windows-x64-${{ needs.get-version.outputs.version }}
        path: AHU-AIO-Windows-x64-${{ needs.get-version.outputs.version }}.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    permissions:
      contents: read
    needs: [get-version, test]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v6

    - name: Set Up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}

    - name: Install Dependencies
      run: flutter pub get

    - name: Enable macOS Desktop
      run: flutter config --enable-macos-desktop

    - name: Build macOS
      run: flutter build macos --release --build-name ${{ needs.get-version.outputs.version }} --build-number ${{ needs.get-version.outputs.build_number }}

    - name: Archive macOS Build
      run: |
        cd build/macos/Build/Products/Release
        zip -r ../../../../../AHU-AIO-macOS-universal-${{ needs.get-version.outputs.version }}.zip ahu_aio.app

    - name: Upload macOS Build
      uses: actions/upload-artifact@v7
      with:
        name: AHU-AIO-macOS-universal-${{ needs.get-version.outputs.version }}
        path: AHU-AIO-macOS-universal-${{ needs.get-version.outputs.version }}.zip

  release:
    name: Create Release
    needs: [get-version, build-android, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download All Artifacts
      uses: actions/download-artifact@v8
      with:
        path: artifacts

    - name: Prepare Release Files
      env:
        VERSION: ${{ needs.get-version.outputs.version }}
        TAG: ${{ needs.get-version.outputs.tag }}
        CHANGELOG: ${{ needs.get-version.outputs.changelog }}
      run: |
        mkdir -p release
        mv artifacts/AHU-AIO-Android-arm64-*/app-release.apk release/AHU-AIO-Android-arm64-${{ needs.get-version.outputs.version }}.apk
        mv artifacts/AHU-AIO-Android-x86_64-*/app-release.apk release/AHU-AIO-Android-x86_64-${{ needs.get-version.outputs.version }}.apk
        mv artifacts/AHU-AIO-Linux-x86_64-*/AHU-AIO-Linux-x86_64-*.tar.gz release/
        mv artifacts/AHU-AIO-Windows-x64-*/AHU-AIO-Windows-x64-*.zip release/
        mv artifacts/AHU-AIO-macOS-universal-*/AHU-AIO-macOS-universal-*.zip release/

        # 生成安装说明
        cat > release/INSTALL.md << 'EOF'
        # 安装说明

        ## Android
        - **arm64**: 适用于大多数现代 Android 设备
        - **x86_64**: 适用于 Android 模拟器或特殊设备

        ## Linux
        解压后运行 `ahu_aio` 可执行文件

        ## Windows
        解压后运行 `ahu_aio.exe` 可执行文件

        ## macOS
        解压后将应用拖入 Applications 文件夹

        ---
        版本: ${{ needs.get-version.outputs.version }}
        构建时间: $(date)
        EOF
        {
          printf '%s\n\n' "$CHANGELOG"
          cat <<EOF
        ## 下载

        ### Android (APK)
        - [AHU-AIO Android arm64](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/AHU-AIO-Android-arm64-${VERSION}.apk)
        - [AHU-AIO Android x86_64](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/AHU-AIO-Android-x86_64-${VERSION}.apk)

        ### Linux
        - [AHU-AIO Linux x86_64](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/AHU-AIO-Linux-x86_64-${VERSION}.tar.gz)

        ### Windows
        - [AHU-AIO Windows x64](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/AHU-AIO-Windows-x64-${VERSION}.zip)

        ### macOS
        - [AHU-AIO macOS Universal](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/AHU-AIO-macOS-universal-${VERSION}.zip)

        详见 [INSTALL.md](https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/INSTALL.md)
        EOF
        } > release-body.md

    - name: Create Or Update Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        REPO: ${{ github.repository }}
        TAG: ${{ needs.get-version.outputs.tag }}
      run: |
        if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
          gh release edit "$TAG" --repo "$REPO" --title "Release $TAG" --notes-file release-body.md
          gh release upload "$TAG" release/* --repo "$REPO" --clobber
        else
          gh release create "$TAG" release/* --repo "$REPO" --title "Release $TAG" --notes-file release-body.md
        fi
