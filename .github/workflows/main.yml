name: Multi-Platform Build

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-android:
    name: Build Android
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - arch: arm64
            target: apk
            build-args: "--release --target-platform android-arm64"
          - arch: x86_64
            target: apk
            build-args: "--release --target-platform android-x64"

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
    
    - name: Set Up Java
      uses: actions/setup-java@v3.12.0
      with:
        distribution: 'oracle'
        java-version: '17'
    
    - name: Set Up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.6'
    
    - name: Install Dependencies
      run: flutter pub get
    
    - name: Build APK
      run: flutter build ${{ matrix.target }} ${{ matrix.build-args }}
    
    - name: Upload APK
      uses: actions/upload-artifact@v5
      with:
        name: AHU-AIO-Android-${{ matrix.arch }}
        path: build/app/outputs/flutter-apk/app-release.apk

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
    
    - name: Install Linux Build Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev
    
    - name: Set Up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.6'
    
    - name: Install Dependencies
      run: flutter pub get
    
    - name: Enable Linux Desktop
      run: flutter config --enable-linux-desktop
    
    - name: Build Linux
      run: flutter build linux --release
    
    - name: Archive Linux Build
      run: |
        cd build/linux/x64/release/bundle
        tar -czf ../../../../../AHU-AIO-Linux-x86_64.tar.gz .
    
    - name: Upload Linux Build
      uses: actions/upload-artifact@v5
      with:
        name: AHU-AIO-Linux-x86_64
        path: AHU-AIO-Linux-x86_64.tar.gz

  build-windows:
    name: Build Windows
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
    
    - name: Set Up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.6'
    
    - name: Install Dependencies
      run: flutter pub get
    
    - name: Enable Windows Desktop
      run: flutter config --enable-windows-desktop
    
    - name: Build Windows
      run: flutter build windows --release
    
    - name: Archive Windows Build
      run: |
        Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath AHU-AIO-Windows-x64.zip
      shell: pwsh
    
    - name: Upload Windows Build
      uses: actions/upload-artifact@v5
      with:
        name: AHU-AIO-Windows-x64
        path: AHU-AIO-Windows-x64.zip

  build-macos:
    name: Build macOS
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3
    
    - name: Set Up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.35.6'
    
    - name: Install Dependencies
      run: flutter pub get
    
    - name: Enable macOS Desktop
      run: flutter config --enable-macos-desktop
    
    - name: Build macOS
      run: flutter build macos --release
    
    - name: Archive macOS Build
      run: |
        cd build/macos/Build/Products/Release
        zip -r ../../../../../AHU-AIO-macOS-universal.zip ahu_aio.app
    
    - name: Upload macOS Build
      uses: actions/upload-artifact@v5
      with:
        name: AHU-AIO-macOS-universal
        path: AHU-AIO-macOS-universal.zip

